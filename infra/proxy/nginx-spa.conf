server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 알 수 없는 경로를 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
