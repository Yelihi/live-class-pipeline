# OpenCV 파이프라인으로 api 서비스 오버라이드
# 사용: docker compose -f infra/compose/docker-compose.local.yml \
#                      -f infra/compose/docker-compose.opencv.yml up api -d
services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/opencv.Dockerfile
    environment:
      - MEDIAMTX_RTSP_BASE_URL=rtsp://mediamtx:8554
      - HLS_DIR=/tmp/hls
      - OUTPUT_DIR=/app/output
