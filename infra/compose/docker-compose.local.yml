version: "3.9"

volumes:
  hls_data:
  recording_data:

services:

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WHIP/WebRTC
      - "9997:9997"   # API
    volumes:
      - ../../media/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/gstreamer.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554/room1
      - HLS_DIR=/tmp/hls
    volumes:
      - hls_data:/tmp/hls
      - recording_data:/app/output
    depends_on:
      - mediamtx
    restart: unless-stopped

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/dashboard.Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_MEDIAMTX_URL=http://localhost:8889
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
